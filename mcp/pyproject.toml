[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-spore"
version = "0.2.1"
description = "Biomimetic agent memory system - MCP extension for Spore"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcp_spore = "mcp_spore.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_spore"]
